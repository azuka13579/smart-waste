name: "Web: build & push to container registry"

# Monorepo: only run when the web dashboard (or this workflow) changes
on:
  push:
    branches:
      - "main"
    paths:
      - "web/**"
      - ".github/workflows/web-build.yaml"
  pull_request:
    branches:
      - "main"
    paths:
      - "web/**"
      - ".github/workflows/web-build.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      # `tsc -b && vite build`. `pnpm lint` is skipped until typescript-eslint supports TypeScript 7.
      - run: pnpm build

  build:
    name: Build image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # ghcr.io/<owner>/web (lowercase, as the registry requires)
      # Tag main-<UTC yyyyMMddHHmmss>, same scheme as the backend so a Flux ImagePolicy
      # (pattern ^main-(\d+)$, numerical asc) always picks the newest build.
      - name: Compute image name and tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/web" >> "$GITHUB_OUTPUT"
          echo "tag=main-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests only check that the image builds; pushes to main publish it
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: echo "Pushed \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
