# Salin ke secrets.yaml, isi nilainya, lalu ENKRIPSI dengan SOPS sebelum commit:
#   sops --encrypt --in-place apps/smart-waste/backend/secrets.yaml
# Jangan pernah commit secrets.yaml dalam bentuk teks biasa.
---
apiVersion: v1
kind: Secret
metadata:
  name: smart-waste-secrets
type: Opaque
stringData:
  # openssl rand -base64 48
  APP_SECRET: "<string acak minimal 32 karakter>"
  ADMIN_PASSWORD: "<password admin awal, minimal 8 karakter>"
  S3_ACCESS_KEY_ID: "<R2 access key id>"
  S3_SECRET_ACCESS_KEY: "<R2 secret access key>"
---
# Dipakai Kubernetes untuk pull image dan oleh Flux ImageRepository untuk membaca daftar tag.
# Buat isinya dengan:
#   kubectl create secret docker-registry ghcr-pull --docker-server=ghcr.io \
#     --docker-username=<github-username> --docker-password=<PAT read:packages> \
#     --dry-run=client -o yaml
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: "<base64 docker config>"
