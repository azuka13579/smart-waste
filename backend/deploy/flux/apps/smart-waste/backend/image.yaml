---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: backend
spec:
  # Ganti <owner> dengan user/organisasi GitHub (huruf kecil)
  image: ghcr.io/<owner>/backend
  interval: 1m
  secretRef:
    name: ghcr-pull
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: backend
spec:
  imageRepositoryRef:
    name: backend
  # Tags from .github/workflows/build.yaml: main-<UTC yyyyMMddHHmmss>
  filterTags:
    pattern: "^main-(\\d+)$"
    extract: "$1"
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: image-auto-update
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  git:
    checkout:
      ref:
        branch: master
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |
        chore(app-smart-waste-backend): update image tags

        Files:
        {{ range $filename, $_ := .Changed.FileChanges -}}
        - {{ $filename }}
        {{ end -}}

        Changes:
        {{range .Changed.Changes}}{{print .OldValue}} -> {{println .NewValue}}{{end}}
  update:
    path: ./apps/smart-waste/backend
    strategy: Setters
