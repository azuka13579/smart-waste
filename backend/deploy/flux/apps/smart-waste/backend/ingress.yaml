apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  annotations:
    cert-manager.io/cluster-issuer: "kakushin-letsencrypt-http01"
    cert-manager.io/private-key-algorithm: ECDSA
    cert-manager.io/private-key-size: "256"
    # Report photos can be up to 10 MB
    haproxy-ingress.github.io/proxy-body-size: "12m"
spec:
  ingressClassName: haproxy
  rules:
    # Ganti dengan domain API kamu (DNS A/CNAME harus mengarah ke ingress cluster)
    - host: api.smartwaste.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
  tls:
    - hosts:
        - api.smartwaste.example.com
      secretName: api.smartwaste.example.com-cert
